spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

  datasource:
    url: jdbc:h2:mem:workmanagement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

app:
  auth:
    login-success-redirect-url: http://localhost:5173/auth/callback
    jwt:
      secret: test-secret-key-must-be-at-least-32-bytes-long
      issuer: test-issuer
      audience: test-audience
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173

