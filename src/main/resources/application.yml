spring:
  application:
    name: be-api-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workmanagement}
    username: ${DB_USERNAME:workmanagement}
    password: ${DB_PASSWORD:workmanagement}
    hikari:
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
