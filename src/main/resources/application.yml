server:
  # 로컬 개발용 SSL(자체 서명)
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}
    key-password: ${SSL_PASSWORD:}

  # ALB 앞단에서 TLS 종료 시 X-Forwarded-* 헤더를 기준으로 원 요청 스킴/호스트를 복원한다.
  # (리다이렉트 URL/보안 관련 요청 해석이 프록시 환경과 일치하도록 맞춤)
  forward-headers-strategy: framework

spring:

  application:
    name: be-api-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1

  jpa:
    # open-in-view: false 설정 이유를 따로 정리해야 할 것 같음
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            # 최초 진입 경로 기본 값: /oauth2/authorization/{registrationId}
            # redirect-uri(필터 주소) 기본 값: {baseUrl}/{action}/oauth2/code/{registrationId}
            # redirect-uri(provider 에 전송) 기본 값: /login/oauth2/code/*
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  auth:
    login-success-redirect-url: ${APP_AUTH_LOGIN_SUCCESS_REDIRECT_URL:https://task-automation-ui.vercel.app/auth/callback}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    jwt:
      # 토큰 발급 및 검증 시 같은 값을 사용해야 함
      # 시크릿 키는 최소 32 바이트 길이로 작성해야 함
      secret: ${APP_JWT_SECRET}
      issuer: ${APP_JWT_ISSUER}
      audience: ${APP_JWT_AUDIENCE}
      access-token-ttl: 15m
      refresh-token-ttl: 180d

  cors:
    allowed-origins:
      - https://task-automation-ui.vercel.app
      - https://localhost:5173
      - https://127.0.0.1:5173
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

review:
  storage:
    enabled: ${REVIEW_STORAGE_ENABLED:false}
    bucket: ${REVIEW_STORAGE_BUCKET:}
    region: ${REVIEW_STORAGE_REGION:ap-northeast-2}
    key-prefix: ${REVIEW_STORAGE_KEY_PREFIX:uploads/review}
    upload-ttl: ${REVIEW_STORAGE_UPLOAD_TTL:5m}
    download-ttl: ${REVIEW_STORAGE_DOWNLOAD_TTL:5m}
    endpoint: ${REVIEW_STORAGE_ENDPOINT:}
