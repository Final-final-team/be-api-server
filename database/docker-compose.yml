services:
  postgres:
    image: postgres:17-alpine
    container_name: heyaji-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data

volumes:
  postgres17_data: